<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentsAlignmentBox</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- One icon set: 24x24, 1.75 stroke, round joins, currentColor. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-logo" viewBox="0 0 24 24"><path d="M12 2.5 4 5.5v6c0 4.8 3.3 8.6 8 10 4.7-1.4 8-5.2 8-10v-6z"/><circle cx="12" cy="8.5" r="1.6"/><circle cx="8.5" cy="14.5" r="1.6"/><circle cx="15.5" cy="14.5" r="1.6"/><path d="M12 10.1v1.4m0 0-2.6 1.8M12 11.5l2.6 1.8"/></symbol>
      <symbol id="i-tree" viewBox="0 0 24 24"><rect x="3" y="3.5" width="7" height="5" rx="1.2"/><rect x="14" y="10" width="7" height="5" rx="1.2"/><rect x="14" y="16.5" width="7" height="5" rx="1.2"/><path d="M6.5 8.5v4h7.5M6.5 12.5v6.5h7.5"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 4.2 2.7 17.5A2 2 0 0 0 4.4 20.5h15.2a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4.5M12 17.2v.1"/></symbol>
      <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l2.5-6.5 5 13L17 12h4"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2.5 4 5.5v6c0 4.8 3.3 8.6 8 10 4.7-1.4 8-5.2 8-10v-6z"/><path d="m8.8 12 2.2 2.2 4.2-4.4"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m10 8.5 5.5 3.5-5.5 3.5z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><rect x="9" y="9" width="6" height="6" rx="1"/></symbol>
      <symbol id="i-revive" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4.5v4h4"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="m7 9.5 3 2.5-3 2.5M12.5 15H17"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
      <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="6" cy="5.5" r="2"/><circle cx="6" cy="18.5" r="2"/><circle cx="18" cy="9.5" r="2"/><path d="M6 7.5v9M18 11.5c0 3-2.5 4-6 4H6"/></symbol>
      <symbol id="i-tool" viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0-5 5L4 17l3 3 5.5-5.5a4 4 0 0 0 5-5l-2.5 2.5-2.5-.5-.5-2.5z"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5.5h16v10H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></symbol>
      <symbol id="i-ban" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m5.7 5.7 12.6 12.6"/></symbol>
      <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/><rect x="9.5" y="9.5" width="5" height="5" rx=".5"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></symbol>
      <symbol id="i-session" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.1M10 6.5h.1"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
      <symbol id="i-prompt" viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <nav class="rail" aria-label="Views">
      <a class="rail-logo" href="#" title="AgentsAlignmentBox"><svg><use href="#i-logo"/></svg></a>
      <button class="rail-btn active" data-view="agents" title="Agents"><svg><use href="#i-tree"/></svg><span>Agents</span></button>
      <button class="rail-btn" data-view="alerts" title="Alerts"><svg><use href="#i-alert"/></svg><span>Alerts</span><b class="rail-count" id="alert-count" hidden></b></button>
      <button class="rail-btn" data-view="activity" title="Activity"><svg><use href="#i-activity"/></svg><span>Activity</span></button>
      <button class="rail-btn" data-view="monitor" title="Monitor"><svg><use href="#i-shield"/></svg><span>Monitor</span></button>
      <div class="rail-spacer"></div>
      <button class="rail-btn launch" id="new-run" title="New run"><svg><use href="#i-plus"/></svg><span>New run</span></button>
    </nav>

    <div class="main">
      <header class="topbar">
        <div class="brand">
          <div class="brand-name">AgentsAlignmentBox</div>
          <div class="brand-sub" id="view-title">Agents</div>
        </div>
        <div class="kpis" id="kpis"></div>
      </header>
      <div class="banner" id="banner" hidden></div>

      <section class="view view-agents" data-view="agents">
        <div class="panel sessions">
          <div class="panel-head"><h2><svg class="ic"><use href="#i-session"/></svg>Sessions</h2>
            <div class="seg" id="session-filter">
              <button data-f="all" class="on">All</button><button data-f="active">Active</button><button data-f="risk">At risk</button>
            </div>
          </div>
          <div class="session-list" id="sessions"></div>
        </div>
        <div class="panel graph">
          <div class="panel-head">
            <h2><svg class="ic"><use href="#i-tree"/></svg><span id="graph-title">Agent tree</span></h2>
            <div class="legend">
              <span><i class="dot running"></i>running</span><span><i class="dot done"></i>done</span>
              <span><i class="dot flagged"></i>flagged</span><span><i class="dot killed"></i>stopped</span>
            </div>
          </div>
          <div class="canvas-wrap" id="canvas-wrap"><div class="canvas-sizer" id="canvas-sizer"><div class="canvas" id="canvas"></div></div></div>
        </div>
        <div class="panel inspector" id="inspector"></div>
      </section>

      <section class="view" data-view="alerts" hidden>
        <div class="panel">
          <div class="panel-head"><h2><svg class="ic"><use href="#i-alert"/></svg>Alert queue</h2>
            <div class="filters">
              <div class="seg" id="alert-status"><button data-f="open" class="on">Open</button><button data-f="all">All</button></div>
              <div class="seg" id="alert-sev"><button data-f="" class="on">Any</button><button data-f="critical">Critical</button><button data-f="high">High+</button><button data-f="medium">Medium+</button></div>
            </div>
          </div>
          <div class="table-wrap"><table class="grid" id="alerts-table"></table></div>
        </div>
      </section>

      <section class="view" data-view="activity" hidden>
        <div class="panel">
          <div class="panel-head"><h2><svg class="ic"><use href="#i-activity"/></svg>Event stream</h2>
            <div class="seg" id="event-filter"><button data-f="" class="on">All</button><button data-f="llm_call">Model</button><button data-f="tool">Tools</button><button data-f="http">Network</button><button data-f="http_blocked">Blocked</button></div>
          </div>
          <div class="table-wrap"><table class="grid" id="events-table"></table></div>
        </div>
      </section>

      <section class="view" data-view="monitor" hidden>
        <div class="monitor-cards" id="monitor-cards"></div>
        <div class="panel">
          <div class="panel-head"><h2><svg class="ic"><use href="#i-shield"/></svg>Monitor cycles</h2></div>
          <div class="table-wrap"><table class="grid" id="cycles-table"></table></div>
        </div>
      </section>
    </div>
  </div>

  <dialog id="run-dialog">
    <form method="dialog" id="run-form">
      <h2><svg class="ic"><use href="#i-play"/></svg>Start a headless agent</h2>
      <div class="seg engine" id="engine"><button type="button" data-f="claude" class="on"><b class="prov cc">CC</b>Claude Code</button><button type="button" data-f="codex"><b class="prov cx">CX</b>Codex</button></div>
      <textarea id="run-prompt" rows="7" placeholder="Task, e.g. Launch two sub-agents: one summarises README.md, the other lists the TODOs in /workspace."></textarea>
      <p class="muted small">Runs as <code>claude -p</code> / <code>codex exec</code> in <code>/workspace</code> with the sandbox's login or API key. Output: <code>workspace/.aab-runs/</code>.</p>
      <div id="runs"></div>
      <p class="error" id="run-error" hidden></p>
      <div class="dialog-actions">
        <button class="btn" value="cancel" formnovalidate>Close</button>
        <button class="btn primary" id="run-go" value="default"><svg class="ic"><use href="#i-play"/></svg>Launch</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
